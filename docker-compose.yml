services:
  db:
    image: postgres:17-alpine
    container_name: octocode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: octocode
    ports:
      - "5432:5432"
    volumes:
      - octocode-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d octocode"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  octocode-db-data:
